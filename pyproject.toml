[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-agent"
version = "0.1.0"
description = "VLM-guided closed-loop exposure parameter adjustment agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dashscope>=1.26,<2",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pillow>=10.4,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "scipy>=1.12,<2",
  "h5py>=3.10,<4",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]
train = [
  "accelerate>=1.0,<2",
  "peft>=0.13,<1",
  "qwen-vl-utils>=0.0.8,<1",
  "torch>=2.4",
  "transformers>=4.49,<5",
]

[project.scripts]
exposure-agent = "exposure_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external VLM services",
]
